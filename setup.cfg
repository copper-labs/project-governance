[metadata]
name = project-governance-runtime
description = Lean, project-neutral governance checks and repository integration
license = Apache-2.0
license_files = LICENSE
classifiers =
    License :: OSI Approved :: Apache Software License

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9,<4
install_requires =
    PyYAML>=6,<7
    jsonschema>=4,<5
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
project_governance_runtime =
    packs/*.yaml
    checker_scripts/*.py
    checker_scripts/*.cjs
    defaults/policies/*.yaml
    defaults/schemas/*.json
    defaults/fixtures/comment-quality/*
    assets/.githooks/*
    assets/tools/*

[options.entry_points]
console_scripts =
    project-governance = project_governance_runtime.cli:main
