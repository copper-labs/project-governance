    title: Coordinate source changes and Codex worktrees
    aliases: [codex-workflow, parallel-worktrees, worktree-upgrades]
    tasks:
      - choose and verify a task checkout without colliding with another writer
      - review and integrate changes while preserving source and evidence identity
      - coordinate governance adoption and safe worktree cleanup
    symbols: [git worktree, workContext, defaultDbPath]
    reference: docs/specs/engine-rc6-linked-retrieval.md
    guides: [docs/developer/guides/source-control-and-worktrees.md]
    sources:
