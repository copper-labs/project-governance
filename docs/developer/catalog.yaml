    title: Deliver governed context at prompt submission
    aliases: [rc6-context, pre-read-retrieval, repository-context-index]
    tasks:
      - configure automatic prompt delivery and bounded metadata selection
      - diagnose missing routes and link actual host usage to context receipts
      - understand the accepted maintained-index and expansion design and its qualification limits
    symbols: [project-governance telemetry context, project-governance doctor --capability context]
    reference: docs/specs/engine-rc6-linked-retrieval.md
