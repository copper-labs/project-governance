version: 1
capabilities:
  - id: first-governed-check
    title: Install the runtime and run the first affected check
    aliases: [runtime-first-check]
    tasks:
      - understand the runtime and adopter responsibility boundary
      - install governance and run a first check
      - diagnose an unavailable installed runtime
    symbols: [project-governance init, project-governance check]
    reference: docs/architecture/governance-runtime.md
    guides: [docs/developer/guides/first-governed-check.md]
    sources:
      - src/project_governance_runtime/installation.py
      - src/project_governance_runtime/planning.py
      - src/project_governance_runtime/runner.py
  - id: change-runtime
    title: Make and prove a focused runtime change
    aliases: [runtime-source-change]
    tasks:
      - locate the source owner for a runtime behavior
      - run focused source proof and the directly affected seam
      - finish a source change with one impacted sign-off
    symbols: [tools/run-source-governance.sh]
    reference: docs/governance/validation-strategy.md
    guides: [docs/developer/guides/change-the-runtime.md]
    sources:
      - AGENTS.md
      - src/project_governance_runtime/cli.py
      - tools/run-source-governance.sh
  - id: resolve-governed-context
    title: Select the smallest governed context packet
    aliases: [context-selection, context-routing]
    tasks:
      - understand proactive skill selection and exact materialization
      - resolve repository context without retaining task content
    symbols: [project-governance context]
    reference: docs/governance/context-routing.md
    guides: [docs/guides/agent-setup-instructions.md]
    sources:
      - src/project_governance_runtime/context.py
  - id: kmp-surface-validation
    title: Define or implement KMP surface validation
    aliases: [kmp-validation-graph, cross-surface-validation]
    tasks:
      - understand the adopter-owned target catalog and cross-surface completeness contract
      - distinguish shallow route areas from guarded target-proof areas
      - implement the subject-consistent bounded validator through the existing pack runner
      - connect enabled graphs to existing KMP agent routing and lifecycle packs
    symbols:
      - kmp-surface-validation
      - project-governance plan --pack
      - project-governance check --pack
    reference: docs/specs/kmp-surface-validation.md
    guides:
      - docs/guides/agent-setup-instructions.md
      - docs/guides/module-authoring.md
    sources:
      - src/project_governance_runtime/assets/skills/kmp-implementation/SKILL.md
      - src/project_governance_runtime/assets/skills/stack-packs/kmp/core/kmp-test-and-evidence/SKILL.md
      - src/project_governance_runtime/checkers.py
      - src/project_governance_runtime/checker_scripts/governance_changed_paths.py
      - src/project_governance_runtime/configuration.py
      - src/project_governance_runtime/execution_commands.py
      - src/project_governance_runtime/execution_flow.py
      - src/project_governance_runtime/kmp_surface_authorities.py
      - src/project_governance_runtime/kmp_surface_composition.py
      - src/project_governance_runtime/kmp_surface_doctor.py
      - src/project_governance_runtime/kmp_surface_validation.py
      - src/project_governance_runtime/skill_selection.py
      - src/project_governance_runtime/structured_documents.py
      - src/project_governance_runtime/validation_subject.py
