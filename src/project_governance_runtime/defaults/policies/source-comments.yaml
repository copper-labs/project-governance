version: 1
owner: __PROJECT_OWNER__
contract: docs/specs/polyglot-source-comment-contract.md
mode: report-existing-enforce-touched
unsupported_languages: advisory
require_overview_labels: false
require_type_context_paragraph: false
minimum_overview_words: 8
active_adapters: [python, kotlin]
source_roots: ["."]
test_scope: excluded
test_globs:
