  - "**/test_*.py"
  - "**/*Test.kt"
  - "**/*Tests.kt"
boundary_globs: []
ignore_paths:
  - "**/generated/**"
  - "**/build/**"
  - "**/vendor/**"
  - "**/.gradle/**"
  - "**/node_modules/**"
  - "src/project_governance_runtime/defaults/fixtures/**"
  - "config/validation/fixtures/**"
