version: 1
owner: __PROJECT_OWNER__
adapters:
  - language: python
    status: active
    analyzer: python-ast
    analyzer_version: stdlib-3.9+
    extensions: [.py]
    capabilities: [file-overview, public-types, public-functions, public-methods]
    fixture_cases:
      - id: python-good
        path: config/validation/fixtures/comment-quality/python-good.py
        expected_blocking_rule_ids: []
      - id: python-missing-overview
        path: config/validation/fixtures/comment-quality/python-missing-overview.py
        expected_blocking_rule_ids: [SC002, SC003]
      - id: python-missing-public-doc
        path: config/validation/fixtures/comment-quality/python-missing-public-doc.py
        expected_blocking_rule_ids: [SC005]
      - id: python-restates-signature
        path: config/validation/fixtures/comment-quality/python-restates-signature.py
        expected_blocking_rule_ids: [SC007]
      - id: python-missing-boundary
        path: config/validation/fixtures/comment-quality/python-missing-boundary.py
        boundary_required: true
        expected_blocking_rule_ids: [SC004]
  - language: kotlin
    status: active
    analyzer: kotlin-token-parser
    analyzer_version: governance-v6
    extensions: [.kt, .kts]
    capabilities: [file-overview, public-types, public-functions, public-methods, annotations, multiline-declarations, enclosing-visibility]
    fixture_cases:
      - id: kotlin-good
        path: config/validation/fixtures/comment-quality/kotlin-good.kt
        expected_blocking_rule_ids: []
      - id: kotlin-annotated-multiline
        path: config/validation/fixtures/comment-quality/kotlin-annotated-multiline.kt
        expected_blocking_rule_ids: []
      - id: kotlin-enclosing-visibility
        path: config/validation/fixtures/comment-quality/kotlin-enclosing-visibility.kt
        expected_blocking_rule_ids: []
      - id: kotlin-missing-public-doc
        path: config/validation/fixtures/comment-quality/kotlin-missing-public-doc.kt
        expected_blocking_rule_ids: [SC005]
      - id: kotlin-missing-overview
        path: config/validation/fixtures/comment-quality/kotlin-missing-overview.kt
        expected_blocking_rule_ids: [SC002, SC003]
      - id: kotlin-wrong-attachment
        path: config/validation/fixtures/comment-quality/kotlin-wrong-attachment.kt
        expected_blocking_rule_ids: [SC005]
      - id: kotlin-protected-member
        path: config/validation/fixtures/comment-quality/kotlin-protected-member.kt
        expected_blocking_rule_ids: []
      - id: kotlin-modified-and-anonymous-types
        path: config/validation/fixtures/comment-quality/kotlin-modified-and-anonymous-types.kt
        expected_blocking_rule_ids: []
      - id: kotlin-missing-boundary
        path: config/validation/fixtures/comment-quality/kotlin-missing-boundary.kt
        boundary_required: true
        expected_blocking_rule_ids: [SC004]
      - id: kotlin-restates-signature
        path: config/validation/fixtures/comment-quality/kotlin-restates-signature.kt
        expected_blocking_rule_ids: [SC007]
  - language: java
    status: planned
    analyzer: none
    analyzer_version: none
    extensions: [.java]
    capabilities: []
    fixture_cases: []
  - language: swift
    status: planned
    analyzer: none
    analyzer_version: none
    extensions: [.swift]
    capabilities: []
    fixture_cases: []
  - language: typescript
    status: planned
    analyzer: none
    analyzer_version: none
