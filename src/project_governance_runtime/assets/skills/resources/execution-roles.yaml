version: 4
kind: delegated-execution-roles
id: execution-roles
agent_neutral: true
finding_schema: .governance/runtime/skills/review-finding.schema.yaml
mode_order: [solo, assisted, coordinated]
selection_default: solo
automatic_escalation_basis: specialist-obligations
context_contract:
  mode: bounded-task-packet
  version: 4
  packet_digest_algorithm: sha256
  optional_target_packet_schema: config/governance/context-packet.schema.yaml
  optional_target_provider_contract: config/governance/context-provider-contract.yaml
  provider_resolution_owner: coordinator
  materialization_boundary: before-delegation
  delegated_role_provider_access: denied
  nested_delegation: prohibited
  estimator:
    method: character-count-divided-by-four
    owner: target-optional
    enforcement: on-demand
    real_provider_usage: optional
roles:
  - id: coordinator
    delegated: false
    purpose: Remain the default implementation writer, dispatch only required specialists, integrate results, and own closeout.
    permissions:
      governed_reads: true
      governed_writes: true
      integration_writes: true
    context:
      mode: coordinator
      startup_budget_tokens: 9000
      result_budget_tokens: 3000
      max_turns: 40
      effort: high
      tool_profile: coordinator
      skill_path: .governance/runtime/skills/delegated-execution/SKILL.md
      static_context_paths:
        - AGENTS.md
        - CHARTER.md
        - .governance/runtime/skills/catalog.yaml
        - .governance/runtime/skills/delegated-execution/SKILL.md
    prohibitions:
      - Delegate final accountability.
      - Accept results that cannot be tied to the assigned scope and snapshot.
  - id: research-scout
    delegated: true
    purpose: Resolve uncertainty and return a compact evidence bundle.
    permissions:
      governed_reads: true
      governed_writes: false
      integration_writes: false
    context:
      mode: bounded-task-packet
      startup_budget_tokens: 1800
      result_budget_tokens: 1200
      max_turns: 8
      effort: medium
      tool_profile: read-only-analysis
      skill_path: .governance/runtime/skills/delegated-research/SKILL.md
      static_context_paths:
        - AGENTS.md
        - .governance/runtime/skills/delegated-research/SKILL.md
    prohibitions:
      - Edit governed artifacts.
      - Expand implementation scope.
  - id: implementation-worker
    delegated: true
    purpose: Implement one explicitly delegated bounded write scope and return focused validation evidence.
    permissions:
      governed_reads: true
      governed_writes: true
      integration_writes: false
    context:
      mode: bounded-task-packet
      startup_budget_tokens: 2200
      result_budget_tokens: 1600
      max_turns: 16
      effort: high
      tool_profile: bounded-writer
      skill_path: .governance/runtime/skills/delegated-implementation/SKILL.md
      static_context_paths:
        - AGENTS.md
        - .governance/runtime/skills/delegated-implementation/SKILL.md
    prohibitions:
      - Edit outside the assigned write scope.
      - Integrate another worker's result.
  - id: build-verifier
    delegated: true
    purpose: Run mechanical validation against a named integrated revision or tree digest.
    permissions:
      governed_reads: true
      governed_writes: false
      integration_writes: false
      generated_build_outputs: true
    context:
      mode: bounded-task-packet
      startup_budget_tokens: 1800
      result_budget_tokens: 800
      max_turns: 8
      effort: low
      tool_profile: mechanical-verification
      skill_path: .governance/runtime/skills/delegated-build-verification/SKILL.md
      static_context_paths:
        - AGENTS.md
        - .governance/runtime/skills/delegated-build-verification/SKILL.md
    prohibitions:
      - Repair governed source while verifying it.
      - Report evidence without the verified snapshot identity.
  - id: qa-reviewer
    delegated: true
    purpose: Independently review the integrated snapshot against governing artifacts and evidence.
    permissions:
      governed_reads: true
      governed_writes: false
      integration_writes: false
    context:
      mode: bounded-task-packet
      startup_budget_tokens: 2200
      result_budget_tokens: 1400
      max_turns: 10
      effort: high
      tool_profile: read-only-review
      skill_path: .governance/runtime/skills/delegated-qa-review/SKILL.md
      static_context_paths:
        - AGENTS.md
        - .governance/runtime/skills/review-finding.schema.yaml
        - .governance/runtime/skills/delegated-qa-review/SKILL.md
    prohibitions:
      - Silently fix its own findings.
      - Review a stale or unidentified snapshot as final evidence.
task_envelope:
  required_fields:
    - task_id
    - role
    - objective
    - required_capability_tier
    - packet_ready
    - specialist_obligation
    - implementation_owner
    - governing_artifacts
    - governing_refs
    - exclusions
    - fixed_decisions
    - acceptance
    - focused_proof
    - output_token_ceiling
    - escalate_or_stop_when
    - context
    - context_mode
    - context_contract_version
    - context_packet_id
    - context_query_id
    - governance_snapshot_digest
    - materialization_lease_id
    - context_packet_ref
    - context_packet_digest
    - context_provider_ids
    - context_budget_tokens
    - result_budget_tokens
    - max_turns
    - effort
    - allow_nested_delegation
    - base_snapshot
    - read_scope
    - write_scope
    - allowed_tools
    - expected_result
    - dependencies
    - stop_conditions
worker_brief:
  schema: .governance/runtime/skills/resources/agent-worker-brief.schema.json
  required_fields:
    - task_id
    - role
    - required_capability_tier
    - objective
    - governing_refs
    - base_snapshot
    - read_scope
    - write_scope
    - exclusions
    - fixed_decisions
    - acceptance
    - focused_proof
    - output_token_ceiling
    - escalate_or_stop_when
result_envelope:
  required_fields:
    - task_id
    - role
    - status
    - outcome
    - base_snapshot
    - result_snapshot
    - context_contract_version
    - context_packet_id
    - context_packet_digest
    - context_provider_ids
    - files_changed
    - commands
    - findings
    - blockers
    - assumptions
    - confidence
    - artifacts
provider_contract:
  invariants:
    - Solo is the default; scope and complexity score alone do not trigger delegation.
    - A delegated role must satisfy an explicit research, build, QA, or implementation-write obligation.
    - The coordinator remains the implementation writer unless one bounded write is explicitly delegated.
    - Selection signals and policy constraints are provider-independent.
    - Role permissions and result fields are provider-independent.
    - Assisted and coordinated modes use one implementation writer.
    - Across active waves, a repository contains at most one delegated writer and two read-only specialists.
    - All roles use the current checkout unless the operator directly authorizes an additional worktree.
    - Delegation alone never authorizes creating or moving a worktree.
    - Delegated roles receive bounded digest-bound context packets and may not delegate again.
    - Context providers are coordinator-side adapters; delegated roles receive normalized materialized items, not provider tools or storage handles.
    - Repository files, graph memory, and later context services preserve one packet and result contract.
    - Startup estimates are proxy measurements; provider-reported usage is optional terminal data.
  adapter_rule: Provider adapters may map native launch controls but may not redefine policy.
  permission_mapping:
    - Roles with governed_writes use the provider's governed-workspace write control.
    - Read-only roles use the provider's planning or read-only control.
    - Build verification may receive a writable native sandbox only for generated or ignored build
      outputs; generated_build_outputs does not grant permission to repair governed source.
  fallback: Return work to the primary; a separate QA wave requires another explicit operator start.
