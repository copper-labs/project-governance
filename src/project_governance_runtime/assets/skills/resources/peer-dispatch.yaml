version: 2
kind: peer-dispatch-resources
id: peer-dispatch
agent_neutral: true
finding_schema: .governance/runtime/skills/review-finding.schema.yaml
default_review_model:
  provider: operator-configured
  role: peer-review
  effort: high
repeated_failure_consultation:
  mode: read-only-second-opinion
  steps:
    - model: claude-opus-5
      effort: high
      when: first-attempt
    - model: claude-fable-5
      effort: xhigh
      when: prior-failed-unavailable-or-inconclusive
  automatic_max: prohibited
resources:
  - id: architecture-review
    skill: .governance/runtime/skills/architecture-review/SKILL.md
    finding_schema: .governance/runtime/skills/review-finding.schema.yaml
    fallback: current-model-dedicated-pass
  - id: docs-governance-review
    skill: .governance/runtime/skills/docs-governance-review/SKILL.md
    finding_schema: .governance/runtime/skills/review-finding.schema.yaml
    fallback: current-model-dedicated-pass
  - id: implementation-quality-review
    skill: .governance/runtime/skills/implementation-quality-review/SKILL.md
    finding_schema: .governance/runtime/skills/review-finding.schema.yaml
    fallback: current-model-dedicated-pass
  - id: qa-review
    skill: .governance/runtime/skills/qa-review/SKILL.md
    finding_schema: .governance/runtime/skills/review-finding.schema.yaml
    fallback: current-model-dedicated-pass
  - id: release-readiness-review
    skill: .governance/runtime/skills/release-readiness-review/SKILL.md
    finding_schema: .governance/runtime/skills/review-finding.schema.yaml
    fallback: current-model-dedicated-pass
  - id: security-trust-review
    skill: .governance/runtime/skills/security-trust-review/SKILL.md
    finding_schema: .governance/runtime/skills/review-finding.schema.yaml
    fallback: current-model-dedicated-pass
  - id: technical-authoring
    skill: .governance/runtime/skills/technical-authoring/SKILL.md
    finding_schema: .governance/runtime/skills/review-finding.schema.yaml
    fallback: current-model-dedicated-pass
