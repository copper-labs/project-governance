id: format
label: Formatting
implementation_status: active
enforcement: blocking
stages: [pre-commit, pre-push, pre-pr, ci-pr]
run_when: matched
path_globs:
  - "**/*.cfg"
  - "**/*.json"
  - "**/*.md"
  - "**/*.py"
  - "**/*.sh"
  - "**/*.toml"
  - "**/*.txt"
  - "**/*.yaml"
  - "**/*.yml"
  - "**/.gitignore"
  - "**/LICENSE"
  - "MANIFEST.in"
  - "**/.githooks/*"
  - "**/hooks/*"
depends_on: []
commands:
  - builtin: format
