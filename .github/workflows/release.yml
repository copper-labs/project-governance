name: Publish Governance Runtime Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: governance-runtime-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix components/harness --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: mkdir -p release-assets
      - run: npm run pack:engine -- release-assets
      - run: node components/engine/scripts/verify-package.mjs release-assets/*.tgz
      - name: Bind release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node components/engine/scripts/release-assets.mjs release-assets/*.tgz "$RELEASE_TAG" "$RELEASE_REPOSITORY" release-assets
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          notes_file=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes_file" ]; then
            set -- --notes-file "$notes_file"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Project Governance $GITHUB_REF_NAME" \
            --generate-notes "$@"
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/*.tgz \
            release-assets/runtime.lock.yaml \
            release-assets/runtime-update.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
