name: Publish Governance Runtime Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: governance-runtime-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref_name, '3.')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix components/harness --ignore-scripts
      # Existing wheel owners remain active until deliberate adopter cutover.
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -p 'test_runtime_*.py'
      - run: python3 -m pip wheel . --no-deps --wheel-dir wheel-proof
      - run: python3 tools/verify-runtime-wheel.py wheel-proof/project_governance_runtime-*.whl
      - run: npm test
      - run: npm run typecheck
      - run: mkdir -p release-assets
      - run: npm run pack:engine -- release-assets
      - run: node components/engine/scripts/verify-package.mjs release-assets/*.tgz
      - name: Bind release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node components/engine/scripts/release-assets.mjs release-assets/*.tgz "$RELEASE_TAG" "$RELEASE_REPOSITORY" release-assets
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          notes_file=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes_file" ]; then
            set -- --notes-file "$notes_file"
          fi
          case "$GITHUB_REF_NAME" in
            *-rc.*) set -- "$@" --prerelease --latest=false ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Project Governance $GITHUB_REF_NAME" \
            --generate-notes "$@"
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/*.tgz \
            release-assets/runtime.lock.yaml \
            release-assets/runtime-update.json
          case "$GITHUB_REF_NAME" in
            *-rc.*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false ;;
          esac

  legacy-release:
    if: startsWith(github.ref_name, '2.')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - run: npm ci --prefix components/harness --ignore-scripts
      - run: npm --prefix components/harness test
      - run: npm --prefix components/harness run typecheck
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -p 'test_runtime_*.py'
      - run: python3 -m pip wheel . --no-deps --wheel-dir dist
      - run: >-
          python3 tools/build_release_assets.py
          --tag "$GITHUB_REF_NAME"
          --wheel dist/project_governance_runtime-*.whl
          --output dist/runtime.lock.yaml
      - run: python3 tools/verify-runtime-wheel.py dist/project_governance_runtime-*.whl
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          notes_file=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes_file" ]; then
            set -- --notes-file "$notes_file"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Project Governance $GITHUB_REF_NAME" \
            --generate-notes "$@"
          gh release upload "$GITHUB_REF_NAME" \
            dist/project_governance_runtime-*.whl \
            dist/runtime.lock.yaml \
            dist/runtime-update.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
