name: Publish Governance Runtime Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: governance-runtime-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -p 'test_runtime_*.py'
      - run: python3 -m pip wheel . --no-deps --wheel-dir dist
      - run: >-
          python3 tools/build_release_assets.py
          --tag "$GITHUB_REF_NAME"
          --wheel dist/project_governance_runtime-*.whl
          --output dist/runtime.lock.yaml
      - run: python3 tools/verify-runtime-wheel.py dist/project_governance_runtime-*.whl
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Project Governance $GITHUB_REF_NAME" \
            --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/project_governance_runtime-*.whl \
            dist/runtime.lock.yaml
          gh release edit "$GITHUB_REF_NAME" --draft=false
