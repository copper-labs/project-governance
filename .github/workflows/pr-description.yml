name: Pull Request Change Narrative

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-description:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Materialize the live pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$PR_BODY_FILE"
      - name: Validate the change narrative
        env:
          PYTHONPATH: src
          PROJECT_GOVERNANCE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -m project_governance_runtime.checkers pr-description "$PR_BODY_FILE"
