name: Governance Runtime Release Proof

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: governance-source-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-readiness:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix components/harness --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: mkdir -p release-assets
      - run: npm run pack:engine -- release-assets
      - run: node components/engine/scripts/verify-package.mjs release-assets/*.tgz
